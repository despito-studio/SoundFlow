<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D Аквариум — Three.js</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #02060c;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  canvas { display: block; outline: none; }
  #ui { position: fixed; left: 16px; top: 16px; color: #d4ecff; background: rgba(4, 22, 40, .55);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border: 1px solid rgba(140, 200, 255, .18);
    border-radius: 14px; padding: 12px 14px; max-width: 300px; font-size: 13px; line-height: 1.5;
    user-select: none; box-shadow: 0 8px 30px rgba(0, 0, 0, .35); }
  #ui h1 { font-size: 16px; margin: 0 0 4px; font-weight: 600; letter-spacing: .3px; }
  #ui .hint { opacity: .78; }
  #ui .btns { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  #ui button { cursor: pointer; border: 1px solid rgba(150, 210, 255, .3); background: rgba(40, 120, 180, .25);
    color: #e6f4ff; border-radius: 9px; padding: 6px 10px; font: inherit; transition: background .2s, transform .1s; }
  #ui button:hover { background: rgba(60, 150, 220, .45); }

  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;

<body>
<div id="loading">Наполняем аквариум…</div>
<div id="ui">
  <h1>🐠 3D Аквариум</h1>
  <div class="hint">ЛКМ — вращать · колесо — приблизить · ПКМ — сдвинуть<br>Двойной клик — постучать по стеклу</div>
  <div class="btns">
    <button id="feed">🍤 Покормить</button>
    <button id="rotate">⟳ Облёт</button>
    <button id="light">🌙 Ночь</button>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { mergeGeometries, mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';

/* =====================================================================
   Утилиты: детерминированный ГСЧ, шум, интерполяция
   ===================================================================== */
let _seed = 20261108;
function rand() {
  _seed = (_seed + 0x6D2B79F5) | 0;
  let t = Math.imul(_seed ^ (_seed >>> 15), 1 | _seed);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const rr = (a, b) => a + (b - a) * rand();
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };
const C = (h) => new THREE.Color(h);
const V = (x, y, z) => new THREE.Vector3(x, y, z);

function hash3(x, y, z) {
  let h = (Math.imul(x, 374761393) + Math.imul(y, 668265263) + Math.imul(z, 1274126177)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function vnoise(x, y, z) {
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
  const xf = x - xi, yf = y - yi, zf = z - zi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf), w = zf * zf * (3 - 2 * zf);
  const c000 = hash3(xi, yi, zi), c100 = hash3(xi + 1, yi, zi);
  const c010 = hash3(xi, yi + 1, zi), c110 = hash3(xi + 1, yi + 1, zi);
  const c001 = hash3(xi, yi, zi + 1), c101 = hash3(xi + 1, yi, zi + 1);
  const c011 = hash3(xi, yi + 1, zi + 1), c111 = hash3(xi + 1, yi + 1, zi + 1);
  const x00 = lerp(c000, c100, u), x10 = lerp(c010, c110, u), x01 = lerp(c001, c101, u), x11 = lerp(c011, c111, u);
  return lerp(lerp(x00, x10, v), lerp(x01, x11, v), w);
}
function fbm(x, y, z, oct = 4) {
  let a = 0.5, f = 1, s = 0, n = 0;
  for (let i = 0; i < oct; i++) { s += a * vnoise(x * f, y * f, z * f); n += a; f *= 2.03; a *= 0.5; }
  return s / n;
}

/* =====================================================================
   Размеры аквариума
   ===================================================================== */
const TW = 24, TH = 13, TD = 12;          // ширина, высота, глубина
const HW = TW / 2, HD = TD / 2;
const GLASS = 0.14;
const WATER_Y = TH - 0.9;

function sandY(x, z) {
  const back = clamp(-z / TD + 0.5, 0, 1);   // 0 — спереди, 1 — сзади
  let h = 0.95 + 1.6 * back * back + 0.5 * back;
  h += (fbm(x * 0.18 + 3.1, 0.0, z * 0.18 + 7.7, 4) - 0.5) * 1.1;
  h += Math.sin(x * 2.2 + z * 0.7 + fbm(x * 0.5, 1.3, z * 0.5, 2) * 5) * 0.035; // мелкая рябь
  return h;
}

/* =====================================================================
   Рендерер, сцена, камера
   ===================================================================== */
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x03070d);
scene.fog = new THREE.FogExp2(0x05202f, 0.013);

const pmrem = new THREE.PMREMGenerator(renderer);
const envTex = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environment = envTex;
scene.environmentIntensity = 0.35;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 300);
camera.position.set(-7, 9.5, 31);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 5.8, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 3;
controls.maxDistance = 70;
controls.maxPolarAngle = Math.PI * 0.62;
controls.autoRotateSpeed = 0.6;
controls.update();

/* =====================================================================
   Общие юниформы и патч стандартных материалов
   (каустика, изгиб тела рыб, колыхание растений)
   ===================================================================== */
const shared = { uTime: { value: 0 }, uCaustic: { value: 1 } };

const CAUSTIC_GLSL = /* glsl */`
float causticFn(vec2 p, float t){
  vec2 i = p; float c = 1.0; float inten = 0.005;
  for (int n = 0; n < 4; n++) {
    float tt = t * (1.0 - (3.5 / float(n + 1)));
    i = p + vec2(cos(tt - i.x) + sin(tt + i.y), sin(tt - i.y) + cos(tt + i.x));
    c += 1.0 / length(vec2(p.x / (sin(i.x + tt) / inten), p.y / (cos(i.y + tt) / inten)));
  }
  c /= 4.0;
  c = 1.17 - pow(c, 1.4);
  return pow(abs(c), 8.0);
}`;

const SWAY_GLSL = /* glsl */`{
  float hf = aSway.x; float w = hf * hf * aSway.z;
  float tt = uTime * (0.9 + 0.25 * sin(aSway.y)) + aSway.y;
  float sx = sin(tt + position.y * 0.45 + position.x * 0.15) * 0.6 + sin(tt * 2.1 + aSway.y * 1.7 + position.y * 0.8) * 0.16;
  float sz = cos(tt * 0.73 + position.y * 0.35 + 1.7 + position.z * 0.2) * 0.4;
  transformed.x += w * (sx + 0.25 * sin(uTime * 0.35 + position.z * 0.2));
  transformed.z += w * sz;
}`;

// Тело рыбы: бегущая волна от головы к хвосту + изгиб при повороте + трепет плавников
const SWIM_NORMAL_GLSL = /* glsl */`{
  float L = uSwim.z; float ft = max((L * 0.5 - position.z) / L, 0.0);
  float A = uSwim.y * L * 0.11; float env = 0.06 + 0.94 * ft * ft; float ph = uSwim.x - ft * 4.2;
  float dft = A * (1.88 * ft * sin(ph) - env * 4.2 * cos(ph)) + uTurn * 2.0 * ft * L * 0.28;
  float dz = -dft / L;
  objectNormal = normalize(vec3(objectNormal.x, objectNormal.y, objectNormal.z - dz * objectNormal.x));
}`;
const SWIM_GLSL = /* glsl */`{
  float L = uSwim.z; float ft = max((L * 0.5 - position.z) / L, 0.0);
  float env = 0.06 + 0.94 * ft * ft;
  transformed.x += sin(uSwim.x - ft * 4.2) * uSwim.y * env * L * 0.11;
  transformed.x += uTurn * ft * ft * L * 0.28;
  transformed.x += aFlex * sin(uSwim.w + uv.x * 6.0 - uv.y * 2.5) * uv.y * L * 0.035;
}`;

function patchMaterial(mat, o = {}) {
  const caust = o.caustics || 0, swim = o.swim || null, sway = !!o.sway;
  mat.onBeforeCompile = (sh) => {
    sh.uniforms.uTime = shared.uTime;
    sh.uniforms.uCaustic = shared.uCaustic;
    let vh = 'uniform float uTime;\n', fh = 'uniform float uTime;\nuniform float uCaustic;\n';
    let vNormal = '', vBegin = '', vProj = '', fOut = '';
    if (swim) {
      sh.uniforms.uSwim = swim.uSwim; sh.uniforms.uTurn = swim.uTurn;
      vh += 'uniform vec4 uSwim;\nuniform float uTurn;\nattribute float aFlex;\n';
      vNormal = SWIM_NORMAL_GLSL; vBegin += SWIM_GLSL;
    }
    if (sway) { vh += 'attribute vec3 aSway;\n'; vBegin += SWAY_GLSL; }
    if (caust > 0) {
      vh += 'varying vec3 vCWorld;\nvarying float vCUp;\n';
      fh += 'varying vec3 vCWorld;\nvarying float vCUp;\n' + CAUSTIC_GLSL;
      vProj = `{
        vec4 cW = vec4(transformed, 1.0);
        vec3 cN = objectNormal;
        #ifdef USE_INSTANCING
          cW = instanceMatrix * cW; cN = mat3(instanceMatrix) * cN;
        #endif
        cW = modelMatrix * cW;
        vCWorld = cW.xyz;
        vCUp = normalize(mat3(modelMatrix) * cN).y;
      }`;
      fOut = `{
        vec2 cp = vCWorld.xz * 0.55 + vec2(vCWorld.y * 0.12);
        float t = uTime * 0.45;
        float c1 = causticFn(cp - 250.0, t);
        float c2 = causticFn(cp * 1.015 - 250.0 + 0.04, t);
        vec3 cc = vec3(c1 * 0.85, (c1 + c2) * 0.5, c2 * 1.05);
        float up = smoothstep(-0.25, 0.9, vCUp);
        float inside = step(abs(vCWorld.x), ${HW.toFixed(2)}) * step(abs(vCWorld.z), ${HD.toFixed(2)}) * step(vCWorld.y, ${WATER_Y.toFixed(2)});
        float depthF = clamp((${WATER_Y.toFixed(2)} - vCWorld.y) / ${WATER_Y.toFixed(2)}, 0.0, 1.0);
        outgoingLight += diffuseColor.rgb * cc * ${caust.toFixed(3)} * up * inside * (1.0 - 0.45 * depthF) * uCaustic;
      }`;
    }
    sh.vertexShader = vh + sh.vertexShader
      .replace('#include <beginnormal_vertex>', '#include <beginnormal_vertex>\n' + vNormal)
      .replace('#include <begin_vertex>', '#include <begin_vertex>\n' + vBegin)
      .replace('#include <project_vertex>', '#include <project_vertex>\n' + vProj);
    sh.fragmentShader = fh + sh.fragmentShader
      .replace('#include <opaque_fragment>', fOut + '\n#include <opaque_fragment>');
  };
  // onBeforeCompile — замыкание, поэтому ключ кэша программ задаём явно
  mat.customProgramCacheKey = () => `aq:${swim ? 1 : 0}${sway ? 1 : 0}:${caust}`;
  return mat;
}

/* =====================================================================
   Процедурные канвас‑текстуры
   ===================================================================== */
function canvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d')]; }

function makeSandTexture() {
  const [c, g] = canvas(512, 512);
  g.fillStyle = '#ece0c6'; g.fillRect(0, 0, 512, 512);
  const pal = ['#ffffff', '#f6eedc', '#d9c7a2', '#c2a97c', '#a89070', '#8e7a62', '#e8d2a8', '#b9b1a3'];
  for (let i = 0; i < 26000; i++) {
    g.fillStyle = pal[(rand() * pal.length) | 0];
    g.globalAlpha = 0.35 + rand() * 0.6;
    const r = 0.5 + rand() * 1.6;
    g.beginPath(); g.arc(rand() * 512, rand() * 512, r, 0, Math.PI * 2); g.fill();
  }
  g.globalAlpha = 1;
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  return t;
}

function makeFinTexture() {
  const [c, g] = canvas(256, 256);
  const img = g.createImageData(256, 256);
  for (let y = 0; y < 256; y++) {
    const v = 1 - y / 255;                       // верх канваса = край плавника
    for (let x = 0; x < 256; x++) {
      const u = x / 255;
      const ray = Math.pow(0.5 + 0.5 * Math.cos(u * Math.PI * 2 * 16), 5);
      const seg = 0.5 + 0.5 * Math.cos(v * Math.PI * 2 * 7 + u * 3);  // членики лучей
      let a = 0.82 - 0.4 * v + ray * 0.2;
      const edge = 0.95 + 0.05 * ray;              // зазубренный край между лучами
      a *= 1 - smooth(edge - 0.06, edge, v);
      const b = 0.86 + ray * 0.14 * (0.8 + 0.2 * seg) - v * 0.06;
      const i = (y * 256 + x) * 4;
      img.data[i] = img.data[i + 1] = img.data[i + 2] = clamp(b, 0, 1) * 255;
      img.data[i + 3] = clamp(a, 0, 1) * 255;
    }
  }
  g.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

function makeScaleTexture() {
  const [c, g] = canvas(256, 256);
  g.fillStyle = '#777'; g.fillRect(0, 0, 256, 256);
  const S = 16;
  for (let row = -1; row <= 256 / S * 2 + 1; row++) {
    for (let col = -1; col <= 256 / S + 1; col++) {
      const cx = col * S + (row % 2 ? S / 2 : 0), cy = row * S / 2;
      const gr = g.createRadialGradient(cx - 3, cy, 1, cx, cy, S * 0.62);
      gr.addColorStop(0, '#d8d8d8'); gr.addColorStop(0.75, '#9a9a9a'); gr.addColorStop(1, '#404040');
      g.fillStyle = gr; g.beginPath(); g.arc(cx, cy, S * 0.62, -Math.PI / 2, Math.PI / 2); g.closePath(); g.fill();
    }
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(12, 6);
  return t;
}

function makeWoodTexture(base, dark, planks, w = 1024, h = 1024) {
  const [c, g] = canvas(w, h);
  const ph = h / planks;
  for (let p = 0; p < planks; p++) {
    const s = 0.82 + rand() * 0.3;
    g.fillStyle = `rgb(${base[0] * s | 0},${base[1] * s | 0},${base[2] * s | 0})`;
    g.fillRect(0, p * ph, w, ph);
    for (let i = 0; i < 46; i++) {
      g.strokeStyle = `rgba(${dark[0]},${dark[1]},${dark[2]},${0.06 + rand() * 0.16})`;
      g.lineWidth = 0.6 + rand() * 1.8;
      g.beginPath();
      const y0 = p * ph + rand() * ph, amp = rand() * 4, fr = 0.004 + rand() * 0.01, ph0 = rand() * 6;
      g.moveTo(0, y0);
      for (let x = 0; x <= w; x += 12) g.lineTo(x, y0 + Math.sin(x * fr + ph0) * amp);
      g.stroke();
    }
    for (let k = 0; k < 2; k++) {                 // сучки
      const kx = rand() * w, ky = p * ph + ph * (0.3 + rand() * 0.4);
      const gr = g.createRadialGradient(kx, ky, 1, kx, ky, 10 + rand() * 10);
      gr.addColorStop(0, `rgba(${dark[0]},${dark[1]},${dark[2]},.7)`); gr.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = gr; g.fillRect(kx - 25, ky - 25, 50, 50);
    }
    g.fillStyle = 'rgba(0,0,0,0.55)'; g.fillRect(0, p * ph, w, 2);
    const off = rand() * w; g.fillRect(off, p * ph, 2, ph);
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  return t;
}

const SAND_TEX = makeSandTexture();
const FIN_TEX = makeFinTexture();
const SCALE_TEX = makeScaleTexture();

/* =====================================================================
   Освещение
   ===================================================================== */
const hemi = new THREE.HemisphereLight(0x9fd8ff, 0x3a2a1a, 0.7);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xfff1dc, 2.8);
sun.position.set(5, 30, 6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -16, right: 16, top: 12, bottom: -12, near: 5, far: 50 });
sun.shadow.bias = -0.0005; sun.shadow.normalBias = 0.03;
scene.add(sun);

const fill = new THREE.DirectionalLight(0x4fa8ff, 0.6);
fill.position.set(-15, 8, 20);
scene.add(fill);

const tankLight = new THREE.PointLight(0xbfe8ff, 35, 30, 2);
tankLight.position.set(0, 11, 3.5);
scene.add(tankLight);

const blueLight = new THREE.PointLight(0x2fb8ff, 25, 22, 2);
blueLight.position.set(-8, 7, -3);
scene.add(blueLight);

const warmLight = new THREE.PointLight(0xffb070, 12, 18, 2);
warmLight.position.set(8, 6, 2);
scene.add(warmLight);

/* =====================================================================
   Комната: пол, тумба, стена
   ===================================================================== */
const FLOOR_Y = -6.1;
{
  const floorTex = makeWoodTexture([120, 82, 52], [40, 22, 10], 8);
  floorTex.repeat.set(10, 10);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(200, 200),
    new THREE.MeshStandardMaterial({ map: floorTex, roughness: 0.62, metalness: 0.05 }));
  floor.rotation.x = -Math.PI / 2; floor.position.y = FLOOR_Y; floor.receiveShadow = true;
  scene.add(floor);

  const wall = new THREE.Mesh(new THREE.PlaneGeometry(200, 60),
    new THREE.MeshStandardMaterial({ color: 0x18222c, roughness: 0.95 }));
  wall.position.set(0, 20, -22);
  scene.add(wall);

  const cabTex = makeWoodTexture([70, 44, 28], [20, 10, 4], 6);
  cabTex.repeat.set(1, 1);
  const cabMat = new THREE.MeshStandardMaterial({ map: cabTex, roughness: 0.45, metalness: 0.05 });
  const cab = new THREE.Mesh(new THREE.BoxGeometry(TW + 0.8, 6, TD + 0.8), cabMat);
  cab.position.y = -3.05; cab.castShadow = cab.receiveShadow = true;
  scene.add(cab);
  const top = new THREE.Mesh(new THREE.BoxGeometry(TW + 1.2, 0.22, TD + 1.2), cabMat);
  top.position.y = -0.11; top.receiveShadow = true;
  scene.add(top);
  const gapMat = new THREE.MeshStandardMaterial({ color: 0x0a0604, roughness: 0.8 });
  const metal = new THREE.MeshStandardMaterial({ color: 0xc9ccd2, roughness: 0.25, metalness: 1.0 });
  for (const x of [-TW / 4, 0, TW / 4]) {
    const gap = new THREE.Mesh(new THREE.BoxGeometry(0.06, 5.4, 0.05), gapMat);
    gap.position.set(x, -3.1, HD + 0.42); scene.add(gap);
  }
  for (const x of [-TW / 4 - 0.6, -TW / 4 + 0.6, TW / 4 - 0.6, TW / 4 + 0.6]) {
    const h = new THREE.Mesh(new THREE.CapsuleGeometry(0.06, 1.2, 4, 12), metal);
    h.position.set(x, -2.2, HD + 0.52); scene.add(h);
  }
}

/* =====================================================================
   Аквариум: стекло, рама, фон, вода, светильник
   ===================================================================== */
const tankGroup = new THREE.Group();
scene.add(tankGroup);

const glassMat = new THREE.MeshPhysicalMaterial({
  color: 0xd6f5ff, metalness: 0, roughness: 0.03, transparent: true, opacity: 0.13,
  envMap: envTex, envMapIntensity: 1.7, clearcoat: 1, clearcoatRoughness: 0.02,
  depthWrite: false, side: THREE.DoubleSide,
});
const glassPanels = [];
function addGlass(w, h, d, x, y, z) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), glassMat);
  m.position.set(x, y, z); m.renderOrder = 10;
  tankGroup.add(m); glassPanels.push(m);
}
addGlass(TW, TH, GLASS, 0, TH / 2, HD - GLASS / 2);
addGlass(TW, TH, GLASS, 0, TH / 2, -HD + GLASS / 2);
addGlass(GLASS, TH, TD - 2 * GLASS, HW - GLASS / 2, TH / 2, 0);
addGlass(GLASS, TH, TD - 2 * GLASS, -HW + GLASS / 2, TH / 2, 0);

{ // торцы стекла (зеленоватый оттенок) и силиконовые швы

const OBSTACLES = [];   // {c: Vector3, r} — препятствия для рыб

function makeRockGeometry(seed, detail, sx, sy, sz, palette) {
  let g = new THREE.IcosahedronGeometry(1, detail);
  g.deleteAttribute('normal'); g.deleteAttribute('uv');
  g = mergeVertices(g);
  const p = g.attributes.position, v = new THREE.Vector3();
  for (let i = 0; i < p.count; i++) {
    v.fromBufferAttribute(p, i);
    const n1 = fbm(v.x * 1.1 + seed, v.y * 1.1 + seed * 0.7, v.z * 1.1 - seed, 4);
    const n2 = fbm(v.x * 3.5 - seed, v.y * 3.5, v.z * 3.5 + seed, 3);
    const n3 = vnoise(v.x * 2.2 + seed * 2, v.y * 2.2, v.z * 2.2);
    let r = 1 + (n1 - 0.5) * 0.9 + (n2 - 0.5) * 0.2 + (1 - Math.abs(2 * n3 - 1)) * 0.1;
    v.multiplyScalar(r);
    v.x *= sx; v.y *= sy; v.z *= sz;
    const fl = -0.4 * sy;
    if (v.y < fl) v.y = fl + (v.y - fl) * 0.25;
    p.setXYZ(i, v.x, v.y, v.z);
  }
  g.computeVertexNormals();
  const nrm = g.attributes.normal, cols = [], c = new THREE.Color();
  const moss = C(0x3f6e2a), moss2 = C(0x5c8a34), dark = C(0x24211e);
  for (let i = 0; i < p.count; i++) {
    v.fromBufferAttribute(p, i);
    const n = fbm(v.x * 2.4 + seed, v.y * 2.4, v.z * 2.4, 3);
    c.copy(palette[0]).lerp(palette[1], smooth(0.3, 0.7, n));
    const strata = Math.sin(v.y * 9 + fbm(v.x, v.y, v.z + seed, 2) * 6);
    c.multiplyScalar(0.82 + 0.25 * fbm(v.x * 7, v.y * 7, v.z * 7, 2) + 0.08 * strata);
    c.lerp(dark, smooth(0.42, 0.25, n) * 0.35);
    const up = nrm.getY(i);
    const mossN = fbm(v.x * 2.0 + 9 + seed, v.y * 2.0, v.z * 2.0, 3);
    c.lerp(mossN > 0.55 ? moss2 : moss, smooth(0.45, 0.85, up) * smooth(0.45, 0.6, mossN) * 0.9);
    cols.push(c.r, c.g, c.b);
  }
  g.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
  return g;
}

  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  // сглаживаем шов и носик
  const n = g.attributes.normal, tv = new THREE.Vector3();
  for (let i = 0; i <= NL; i++) {
    const a = i * (NR + 1), b = a + NR;
    tv.set(n.getX(a) + n.getX(b), n.getY(a) + n.getY(b), n.getZ(a) + n.getZ(b)).normalize();
    n.setXYZ(a, tv.x, tv.y, tv.z); n.setXYZ(b, tv.x, tv.y, tv.z);
  }
  for (let j = 0; j <= NR; j++) n.setXYZ(j, 0, 0, 1);
  return g;
}

function buildMedianFins(sp) {
  const B = newBuilder(), L = sp.len, H = sp.height;
  const s = (t) => bodyShape(t, sp);
  const topY = (t) => H * 0.5 * sp.top * s(t), botY = (t) => -H * 0.5 * sp.bot * s(t);
  const zAt = (t) => L * 0.5 - t * L;
  const median = (f, up) => {
    const yb = (t) => up ? topY(t) : botY(t);
    finStrip(B,
      (u) => { const t = lerp(f.t0, f.t1, u); return V(0, yb(t) * 0.88, zAt(t)); },
      (u) => { const t = lerp(f.t0, f.t1, u), hp = f.h * L * f.prof(u); return V(0, yb(t) + (up ? hp : -hp), zAt(t) - f.sweep * hp); },
      16, 7, (u, v) => f.col(u, v, lerp(f.t0, f.t1, u)), sp.flex, null);
  };
  if (sp.dorsal) median(sp.dorsal, true);
  if (sp.anal) median(sp.anal, false);
  const tl = sp.tail, ped = s(1) * 0.92;
  const rootY = (u) => lerp(-H * 0.5 * sp.bot * ped, H * 0.5 * sp.top * ped, u);
  const z0 = -L * 0.5 + 0.05 * L;
  finStrip(B,
    (u) => V(0, rootY(u), z0),
    (u) => { const phi = lerp(-tl.spread, tl.spread, u), l = tl.len * L * tl.prof(u); return V(0, rootY(u) + Math.sin(phi) * l, z0 - Math.cos(phi) * l); },
    22, 9, (u, v) => tl.col(u, v), sp.flex * 1.3, tl.sag ? V(0, -tl.sag * L, 0) : null);
  return builderGeometry(B);
}

function buildPairFin(f, L) {
  const B = newBuilder(), l = f.len * L, w = f.w * L;
  finStrip(B,
    (u) => V(0, lerp(-w * 0.5, w * 0.5, u), 0),
    (u) => { const a = lerp(-0.35, 0.45, u) * (f.spread ?? 1); const ll = l * (f.prof ? f.prof(u) : 0.7 + 0.3 * Math.sin(Math.PI * u)); return V(0, lerp(-w * 0.5, w * 0.5, u) + Math.sin(a) * ll, -Math.cos(a) * ll); },
    8, 6, (u, v) => f.col(u, v), 0, null);
  return builderGeometry(B);
}

function buildEyes(sp) {
  const L = sp.len, H = sp.height, W = sp.width;
  const t = sp.eyeT, s = bodyShape(t, sp), ey = sp.eyeY;
  const y = ey * H * 0.5 * sp.top * s;
  const x = W * 0.5 * s * Math.pow(Math.max(0.05, Math.cos(Math.asin(clamp(ey, -0.95, 0.95)))), sp.ex || 0.9);
  const z = L * 0.5 - t * L, re = sp.eyeR * L;
  const iris = [], pupil = [];
  for (const sx of [-1, 1]) {
    iris.push(new THREE.SphereGeometry(re, 18, 14).translate(sx * (x - re * 0.35), y, z));
    pupil.push(new THREE.SphereGeometry(re * 0.62, 16, 12).translate(sx * (x + re * 0.12), y, z + re * 0.05));
  }
  return { iris: mergeGeometries(iris), pupil: mergeGeometries(pupil) };
}

  update(dt, t) {
    const sp = this.sp, p = this.pos, v = this.vel, acc = _acc.set(0, 0, 0), r = this.radius;
    const maxS = sp.speed[1] * this.speedMul, minS = sp.speed[0] * this.speedMul;
    this.fear = Math.max(0, this.fear - dt);
    const mood = clamp(0.4 + 0.35 * Math.sin(t * 0.23 + this.seed * 6.28) + 0.2 * Math.sin(t * 0.71 + this.seed * 3), 0, 1);
    let cruise = lerp(minS, maxS, mood);
    const k = maxS * 3.0;
    const seek = (tp, speed, w) => {
      _v1.subVectors(tp, p); const d = _v1.length();
      if (d > 1e-4) { _v1.multiplyScalar(speed / d * Math.min(1, d / 1.5 + 0.3)).sub(v).multiplyScalar(w); acc.add(_v1); }
      return d;
    };

    // корм
    let best = null, bd = 100;
    for (const f of foods) if (f.alive && f.age > 0.6) { const d = f.pos.distanceToSquared(p); if (d < bd) { bd = d; best = f; } }
    this.feeding = !!best;
    if (best) {
      seek(best.pos, maxS * 1.3, 2.5);
      _fwd.set(0, 0, 1).applyQuaternion(this.group.quaternion);
      const nose = _v1.copy(p).addScaledVector(_fwd, sp.len * this.size * 0.5);
      if (nose.distanceTo(best.pos) < 0.22 + 0.12 * this.size) best.alive = false;
    } else if (sp.school) {
      seek(sp._target, cruise, 0.5);
    } else {
      this.retarget -= dt;
      if (p.distanceTo(this.target) < 1.2 || this.retarget < 0) { randomTarget(sp, this.target); this.retarget = rr(4, 10); }
      seek(this.target, cruise, 0.8);
    }
    if (this.fear > 0) cruise = maxS * 1.8;

    // стенки, дно, поверхность
    const bx = HW - 0.9 - r, bz = HD - 0.9 - r;
    const floor = sandY(p.x, p.z) + (this.feeding ? 0.25 : 0.7) + r * 0.3, ceil = WATER_Y - 0.5 - r * 0.3;
    const wall = (d, m) => { const x = clamp(d / m, 0, 2); return x * x; };
    acc.x -= k * wall(p.x - (bx - 2.2), 2.2); acc.x += k * wall((-bx + 2.2) - p.x, 2.2);
    acc.z -= k * wall(p.z - (bz - 2.0), 2.0); acc.z += k * wall((-bz + 2.0) - p.z, 2.0);
    acc.y += k * wall(floor + 1.2 - p.y, 1.2); acc.y -= k * wall(p.y - (ceil - 1.0), 1.0);

    // камни и коряга
    for (const o of OBSTACLES) {
      _v1.subVectors(p, o.c); const d = _v1.length(), R = o.r + r + 0.25;
      if (d < R + 1.6 && d > 1e-4) {
        _v1.divideScalar(d);
        const f = (R + 1.6 - d) / 1.6;
        acc.addScaledVector(_v1, k * f * f * 1.3);
        if (d < R) p.addScaledVector(_v1, (R - d) * Math.min(1, dt * 8));
      }
    }

    // разделение и стайность
    let ac = 0; _al.set(0, 0, 0); _co.set(0, 0, 0);
    for (const o of fishes) {
      if (o === this) continue;
      _v1.subVectors(p, o.pos); const d2 = _v1.lengthSq(), sr = r + o.radius + 0.35;
      if (d2 < sr * sr && d2 > 1e-6) { const d = Math.sqrt(d2); acc.addScaledVector(_v1, (sr - d) / sr * k * 1.2 / d); }
      if (sp.school && o.sp === sp && d2 < 9) { _al.add(o.vel); _co.add(o.pos); ac++; }
    }
    if (ac) {
      acc.add(_al.divideScalar(ac).sub(v).multiplyScalar(0.9));
      acc.add(_co.divideScalar(ac).sub(p).multiplyScalar(0.7));
    }

    // интегрирование
    const maxF = maxS * 2.2 + (this.fear > 0 ? 8 : 0);
    if (acc.length() > maxF) acc.setLength(maxF);
    v.addScaledVector(acc, dt);
    v.y *= 1 - Math.min(1, dt * 0.6);
    const hs = Math.hypot(v.x, v.z), vyMax = 0.35 * hs + 0.25;
    v.y = clamp(v.y, -vyMax, vyMax);
    let s = v.length();
    const sMax = this.fear > 0 ? maxS * 2.2 : Math.max(cruise * 1.25, minS);
    if (s > sMax) v.multiplyScalar(sMax / s);
    if (s < minS * 0.4) { if (s < 1e-4) v.set(rand() - 0.5, 0, rand() - 0.5); v.setLength(minS * 0.4); }
    s = v.length();

    // ориентация: плавный поворот носом по направлению движения
    const dir = _v1.copy(v).normalize();
    const pitch = clamp(Math.atan2(dir.y, Math.hypot(dir.x, dir.z)), -0.5, 0.5);
    const yaw = Math.atan2(dir.x, dir.z);
    _q.setFromEuler(_e.set(-pitch, yaw, -this.turn * 0.25, 'YXZ'));
    this.group.quaternion.slerp(_q, 1 - Math.exp(-dt * sp.turnSpeed * (this.fear > 0 ? 2 : 1)));

    _fwd.set(0, 0, 1).applyQuaternion(this.group.quaternion);
    p.addScaledVector(_fwd, s * dt * 0.8).addScaledVector(v, dt * 0.2);
    p.x = clamp(p.x, -bx - 0.4, bx + 0.4); p.z = clamp(p.z, -bz - 0.4, bz + 0.4);
    p.y = clamp(p.y, sandY(p.x, p.z) + 0.2 + r * 0.2, WATER_Y - 0.25);
    this.group.position.copy(p);

    // скорость поворота → изгиб тела
    const yawNow = Math.atan2(_fwd.x, _fwd.z);
    let dy = yawNow - this.prevYaw;
    dy = Math.atan2(Math.sin(dy), Math.cos(dy));
    this.prevYaw = yawNow;
    this.turn = lerp(this.turn, clamp(dy / Math.max(dt, 1e-3) * 0.3, -1, 1), 1 - Math.exp(-dt * 5));

    // анимация тела и плавников
    const u = this.uniforms.uSwim.value, sn = s / maxS;
    u.x += dt * Math.PI * 2 * (sp.beat * (0.6 + 1.1 * sn) + (this.fear > 0 ? 2 : 0));
    u.y = sp.amp * (0.45 + 0.55 * clamp(sn, 0, 1.5)) + Math.abs(this.turn) * 0.25;
    u.w += dt * (5 + sn * 3);
    this.uniforms.uTurn.value = this.turn;

    this.pecPhase += dt * (5.5 - 2.5 * clamp(sn, 0, 1));
    for (const pr of this.pairs) {
      const ft = pr.ft, env = 0.06 + 0.94 * ft * ft;
      const off = Math.sin(u.x - ft * 4.2) * u.y * env * sp.len * 0.11 + this.turn * ft * ft * sp.len * 0.28;
      pr.pivot.position.x = pr.x + off;
      const flap = pr.below ? 0.12 * Math.sin(this.pecPhase * 0.6) : 0.4 * Math.sin(this.pecPhase + (pr.side > 0 ? 0 : 0.6));
      const base = pr.below ? 0.35 : 0.55 + 0.4 * (1 - clamp(sn, 0, 1));
      pr.pivot.rotation.set(pr.droop, -pr.side * (base + flap), 0);
    }
  }

  scare(point) {
    _v1.subVectors(this.pos, point);
    const d = _v1.length();
    if (d < 8) {
      this.fear = 1.2 + rand() * 0.6;
      this.vel.addScaledVector(_v1.normalize(), this.sp.speed[1] * 2.5);
    }
  }
}

for (const sp of SPECIES) {
  if (sp.school) { sp._target = randomTarget(sp, V(0, 0, 0)); sp._timer = rr(5, 9); }
  for (let i = 0; i < sp.count; i++) fishes.push(new Fish(sp));
}
// стайка неонов стартует вместе
{ const neon = fishes.filter(f => f.sp.school); const c = neon[0].pos.clone(); neon.forEach(f => f.pos.copy(c).add(V(rr(-1.5, 1.5), rr(-0.6, 0.6), rr(-1, 1)))); }

/* =====================================================================
   Постобработка
   ===================================================================== */
const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(innerWidth, innerHeight, { type: THREE.HalfFloatType, samples: 4 }));
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.38, 0.55, 0.88);
composer.addPass(bloom);
composer.addPass(new OutputPass());
composer.setSize(innerWidth, innerHeight);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
});

/* =====================================================================
   Интерфейс
   ===================================================================== */
let nightTarget = 0, night = 0;
document.getElementById('feed').onclick = feed;
document.getElementById('rotate').onclick = (e) => { controls.autoRotate = !controls.autoRotate; e.currentTarget.classList.toggle('on', controls.autoRotate); };
document.getElementById('light').onclick = (e) => { nightTarget = 1 - nightTarget; e.currentTarget.textContent = nightTarget ? '☀️ День' : '🌙 Ночь'; };

const raycaster = new THREE.Raycaster(), ndc = new THREE.Vector2();
const tankBox = new THREE.Box3(V(-HW, 0, -HD), V(HW, TH, HD));
renderer.domElement.addEventListener('dblclick', (ev) => {
  ndc.set(ev.clientX / innerWidth * 2 - 1, -(ev.clientY / innerHeight) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const hit = raycaster.ray.intersectBox(tankBox, V(0, 0, 0));
  if (hit) {
    fishes.forEach(f => f.scare(hit));
    for (let i = 0; i < 12; i++) spawnBubble(hit.clone().clampScalar(-100, 100).setY(clamp(hit.y, 1, WATER_Y - 1)), rr(0.03, 0.08), 0.4);
  }
});

/* =====================================================================
   День / ночь
   ===================================================================== */
const DAY = { sun: 2.8, sunC: C(0xfff1dc), hemi: 0.7, tank: 35, blue: 25, warm: 12, caustic: 1.0, rays: 1.0, led: new THREE.Color(3.0, 3.2, 3.4), back: 1.0, fog: C(0x05202f), env: 0.35 };
const NIGHT = { sun: 0.5, sunC: C(0x6a86ff), hemi: 0.15, tank: 6, blue: 30, warm: 0, caustic: 0.35, rays: 0.3, led: new THREE.Color(0.3, 0.6, 3.0), back: 0.4, fog: C(0x020a16), env: 0.12 };
function applyLighting(k) {
  sun.intensity = lerp(DAY.sun, NIGHT.sun, k); sun.color.copy(DAY.sunC).lerp(NIGHT.sunC, k);
  hemi.intensity = lerp(DAY.hemi, NIGHT.hemi, k);
  tankLight.intensity = lerp(DAY.tank, NIGHT.tank, k);
  blueLight.intensity = lerp(DAY.blue, NIGHT.blue, k);
  warmLight.intensity = lerp(DAY.warm, NIGHT.warm, k);
  shared.uCaustic.value = lerp(DAY.caustic, NIGHT.caustic, k);
  rayUniforms.uInt.value = lerp(DAY.rays, NIGHT.rays, k);
  ledMat.color.copy(DAY.led).lerp(NIGHT.led, k);
  backdropMat.uniforms.uLight.value = lerp(DAY.back, NIGHT.back, k);
  scene.fog.color.copy(DAY.fog).lerp(NIGHT.fog, k);
  scene.environmentIntensity = lerp(DAY.env, NIGHT.env, k);
}

/* =====================================================================
   Главный цикл
   ===================================================================== */
const clock = new THREE.Clock();
let firstFrame = true;
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;
  shared.uTime.value = t;

  night += (nightTarget - night) * Math.min(1, dt * 2);
  applyLighting(night);

  for (const sp of SPECIES) if (sp.school) {
    sp._timer -= dt;
    if (sp._timer < 0) { randomTarget(sp, sp._target); sp._timer = rr(5, 10); }
  }
  for (const f of fishes) f.update(dt, t);
  updateBubbles(dt, t);
  updateFood(dt, t);
  updateWater(t);

  controls.update();
  composer.render();
  if (firstFrame) { firstFrame = false; document.getElementById('loading').classList.add('hidden'); }
});
</script>

  // Сообщение, если модули/WebGL не загрузились
  window.addEventListener('error', (e) => {
    const l = document.getElementById('loading');
    if (l && !l.classList.contains('hidden')) l.textContent = 'Ошибка загрузки: ' + (e.message || 'проверьте подключение к интернету (Three.js грузится с CDN)');
  });
</script>
