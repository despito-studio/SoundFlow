name: Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: media-provider/package-lock.json
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Build audio core
        run: cargo build --release --locked
      - name: Build media provider and bundled runtime
        shell: pwsh
        run: |
          npm ci --prefix media-provider
          if ($LASTEXITCODE -ne 0) { throw 'Media dependencies could not be installed.' }
          node scripts/build-provider.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Media provider build failed.' }
      - name: Build Flutter Windows application
        working-directory: flutter_app
        shell: pwsh
        run: |
          flutter pub get
          if ($LASTEXITCODE -ne 0) { throw 'Flutter dependencies could not be resolved.' }
          flutter build windows --release
          if ($LASTEXITCODE -ne 0) { throw 'Flutter Windows build failed.' }
      - name: Assemble Windows bundle
        shell: pwsh
        run: |
          $bundle = 'output/flutter-preview'
          New-Item -ItemType Directory -Path $bundle -Force | Out-Null
          Copy-Item -Path 'flutter_app/build/windows/x64/runner/Release/*' -Destination $bundle -Recurse -Force
          Copy-Item -LiteralPath 'target/release/soundflow_lib.dll' -Destination $bundle
          New-Item -ItemType Directory -Path "$bundle/licenses" -Force | Out-Null
          $flutterRoot = Split-Path (Split-Path (Get-Command flutter).Source)
          Copy-Item -LiteralPath "$flutterRoot/LICENSE" -Destination "$bundle/licenses/FLUTTER-LICENSE.txt"
          New-Item -ItemType Directory -Path "$bundle/resources" -Force | Out-Null
          Copy-Item -LiteralPath 'resources/licenses' -Destination "$bundle/resources" -Recurse
      - name: Install installer compiler
        run: choco install nsis --no-progress --yes
      - name: Package portable ZIP and installer
        shell: pwsh
        run: |
          $env:PATH = "${env:ProgramFiles(x86)}/NSIS;$env:PATH"
          ./scripts/package-windows.ps1
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: soundflow-windows-x64
          path: |
            dist/SoundFlow-*-windows-x64.zip
            dist/SoundFlow-*-Setup.exe
          if-no-files-found: error
