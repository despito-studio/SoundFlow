[package]
name = "soundflow"
version = "3.4.1"
description = "SoundFlow native music application"
authors = ["SoundFlow"]
edition = "2021"
rust-version = "1.92"

[lib]
name = "soundflow_lib"
path = "src/lib.rs"

[[bin]]
name = "soundflow"
path = "src/main.rs"

[build-dependencies]
slint-build = "=1.18.1"
winresource = "0.1"

[dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-femtovg", "renderer-software", "accessibility", "system-tray", "compat-1-18"] }
rodio = { version = "=0.21.1", default-features = false, features = ["playback", "symphonia-all"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.37", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
sha2 = "0.10"
dirs = "6"
walkdir = "2"
tempfile = "3"
url = "2"
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }
sysinfo = "0.37"
rfd = { version = "0.17", default-features = false, features = ["xdg-portal", "pollster", "common-controls-v6"] }
open = "5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }

[profile.release]
strip = "debuginfo"
codegen-units = 8
