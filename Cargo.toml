[package]
name = "soundflow"
version = "1.0.0"
description = "SoundFlow native music application"
autobins = false
authors = ["SoundFlow"]
edition = "2021"
rust-version = "1.92"

[lib]
name = "soundflow_lib"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
winresource = "0.1"

[dependencies]
rodio = { version = "=0.21.1", default-features = false, features = ["playback", "symphonia-all"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.37", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
sha2 = "0.10"
dirs = "6"
walkdir = "2"
tempfile = "3"
url = "2"
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }
sysinfo = "0.37"
rfd = { version = "0.17", default-features = false, features = ["xdg-portal", "pollster", "common-controls-v6"] }
open = "5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
velopack = { version = "=1.2.161", features = ["public-utils"] }
semver = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }

[profile.release]
strip = "debuginfo"
codegen-units = 8

[dev-dependencies]
zip = { version = "=8.6.0", default-features = false }

[workspace]
resolver = "2"
